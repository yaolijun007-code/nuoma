name: Verify health survey

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build all branded sites
        run: npm run build:all
        env:
          # CI only verifies that every brand can compile. These placeholders are
          # never deployed and keep real CloudBase browser credentials out of Git.
          VITE_CLOUDBASE_ENV_ID: ci-build-placeholder
          VITE_CLOUDBASE_ACCESS_KEY: ci-build-placeholder
